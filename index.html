<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 웹툰 생성기</title><style>body{margin:0;background:#10121a;color:#f5f5ff;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px}h1{font-size:28px}textarea,input,select,button{box-sizing:border-box;width:100%;border:1px solid #42475c;border-radius:12px;background:#202433;color:white;padding:13px;font:inherit;margin:7px 0}button{background:#7958ff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.panel{background:#191c29;border-radius:18px;padding:17px;margin:15px 0}.hint{color:#aab0c7;font-size:13px}.comic{background:white;color:#151515;padding:18px;max-width:650px;margin:20px auto}.frame{min-height:240px;border:3px solid #141414;margin:12px 0;position:relative;overflow:hidden;background:linear-gradient(145deg,#b9c7e7,#eee);display:flex;flex-direction:column;justify-content:space-between}.scene{font-weight:bold;background:#ffffffd9;margin:10px;padding:8px;border-radius:8px;align-self:flex-start}.visual{flex:1;display:grid;place-items:center;font-size:80px;min-height:100px}.bubble{background:white;border:2px solid black;border-radius:25px;padding:13px;margin:10px;max-width:75%;align-self:flex-end;white-space:pre-wrap}.frame img{width:100%;display:block}.status{color:#c7c0ff}.hidden{display:none}</style></head><body><main><h1>✨ AI 웹툰 생성기</h1><p class="hint">줄거리만 입력하면 컷별 스토리와 대사를 만들고, 이미지 생성 API를 연결하면 그림도 생성합니다.</p><section class="panel"><label>웹툰 내용</label><textarea id="idea" rows="4" placeholder="예: 평범한 고등학교에 좀비가 나타나고, 전학생이 비밀 능력을 각성한다"></textarea><label>장르</label><select id="genre"><option>액션</option><option>로맨스</option><option>공포</option><option>코미디</option><option>판타지</option></select><label>컷 수</label><select id="count"><option>4</option><option selected>6</option><option>8</option></select><label>OpenAI API 키 (선택, 브라우저에서만 사용)</label><input id="key" type="password" placeholder="sk-... (실제 AI 생성에 필요)"><p class="hint">키를 입력하지 않으면 오프라인 데모를 생성합니다. 키는 저장하지 않습니다. 브라우저에서 API를 직접 호출하면 보안 제한으로 실패할 수 있습니다. 공개 웹사이트나 공유 HTML에 API 키를 넣지 마세요. API 사용 요금이 발생할 수 있습니다.</p><button id="make">웹툰 자동 생성</button><button id="demo" type="button" style="background:#343a55">API 없이 데모 생성</button><p id="status" class="status"></p></section><section id="result" class="hidden"><button id="save">웹툰 HTML 저장</button><div id="comic" class="comic"></div></section></main><script>
const $=x=>document.getElementById(x);let panels=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function offline(idea,n,genre){let steps=['평범했던 하루, 이상한 일이 시작된다.','주인공은 믿을 수 없는 광경을 목격한다.','위험이 다가오고 선택의 순간이 찾아온다.','예상치 못한 인물이 등장한다.','숨겨진 진실이 드러나기 시작한다.','주인공은 용기를 내어 맞선다.','모든 것이 뒤집히는 반전이 일어난다.','새로운 이야기를 암시하며 막이 내린다.'];return Array.from({length:n},(_,i)=>({scene:i===0?idea:steps[i],dialogue:['이게 대체 무슨 일이야?!','설마… 진짜라고?','도망쳐!','내가 해결할게.','이건 시작에 불과해…','절대 포기하지 않아!','뭐라고?!','다음 화에 계속…'][i],visual_prompt:genre+' 웹툰, '+idea+', '+steps[i],emoji:['🏫','😱','⚡','🕵️','🌑','🔥','💥','🌅'][i]}))}function render(){const el=$('comic');el.innerHTML='<h2>'+esc($('idea').value.slice(0,60)||'나의 웹툰')+'</h2>'+panels.map((p,i)=>'<article class="frame"><div class="scene">'+(i+1)+'컷 · '+esc(p.scene)+'</div>'+(p.image?'<img alt="'+esc(p.visual_prompt)+'" src="'+p.image+'">':'<div class="visual">'+esc(p.emoji||'🎬')+'</div>')+'<div class="bubble">'+esc(p.dialogue)+'</div></article>').join('');$('result').classList.remove('hidden')}
async function callAI(key,idea,n,genre){const instructions='당신은 한국 웹툰 작가다. 다음 설정으로 정확히 '+n+'컷을 작성하라. JSON 객체만 반환: {"panels":[{"scene":"한국어 짧은 장면 설명","dialogue":"한국어 대사","visual_prompt":"영어로 자세한 웹툰 일러스트 장면 묘사"}]}. 캐릭터 외형을 컷마다 일관되게 묘사하라.';const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',response_format:{type:'json_object'},messages:[{role:'system',content:instructions},{role:'user',content:'장르: '+genre+'\n줄거리: '+idea}]})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'스토리 생성 실패');const p=JSON.parse(j.choices[0].message.content).panels;if(!Array.isArray(p)||!p.length)throw Error('잘못된 스토리 응답');return p.slice(0,n)}async function makeImage(key,p){const r=await fetch('https://api.openai.com/v1/images/generations',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:'gpt-image-1',prompt:'Vertical Korean webtoon panel, high quality clean anime comic art, no text, no letters, no speech bubbles. '+p.visual_prompt,size:'1024x1536'})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'그림 생성 실패');return 'data:image/png;base64,'+j.data[0].b64_json}
$('make').onclick=async()=>{let idea=$('idea').value.trim(),key=$('key').value.trim(),n=+$('count').value,genre=$('genre').value;if(!idea){alert('줄거리를 입력해 주세요');return}$('make').disabled=true;try{if(key){$('status').textContent='AI가 스토리를 작성하는 중…';panels=await callAI(key,idea,n,genre);render();for(let i=0;i<panels.length;i++){ $('status').textContent=`AI 그림 생성 중… ${i+1}/${panels.length}`;try{panels[i].image=await makeImage(key,panels[i]);render()}catch(e){$('status').textContent=`${i+1}컷 그림 오류: ${e.message}`;break}}$('status').textContent+=' 생성 작업이 종료되었습니다.'}else{panels=offline(idea,n,genre);render();$('status').textContent='오프라인 데모 생성 완료! 실제 AI 그림은 API 키를 입력하세요.'}}catch(e){$('status').textContent='오류: '+(e instanceof TypeError && /load failed|failed to fetch|network/i.test(e.message) ? 'AI 서버 연결 실패. 아이폰 파일 앱에서 실행하거나 브라우저의 보안 제한(CORS) 때문에 발생할 수 있습니다. 이 HTML만으로 해결할 수 없으며, 실제 AI 생성은 서버 중계가 필요합니다. 아래 데모 버튼은 API 없이 작동합니다.' : e.message)}finally{$('make').disabled=false}};
$('demo').onclick=()=>{const idea=$('idea').value.trim();if(!idea){alert('줄거리를 입력해 주세요');return}panels=offline(idea,+$('count').value,$('genre').value);render();$('status').textContent='데모 생성 완료 (AI 그림 아님).'};
$('save').onclick=()=>{let html='<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 웹툰</title><style>body{background:#ddd;font-family:system-ui}.comic{max-width:650px;margin:auto;background:white;padding:15px}.frame{border:3px solid black;margin:12px 0;padding:12px}.bubble{border:2px solid black;border-radius:24px;padding:12px;margin:10px}img{width:100%}</style><div class="comic"><h1>'+esc($('idea').value)+'</h1>'+panels.map(p=>'<div class="frame"><p>'+esc(p.scene)+'</p>'+(p.image?'<img src="'+p.image+'">':'<h1>🎬</h1>')+'<p class="bubble">'+esc(p.dialogue)+'</p></div>').join('')+'</div></html>';let a=document.createElement('a'),u=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.href=u;a.download='내_웹툰.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
